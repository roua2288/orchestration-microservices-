apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-microservices
  namespace: microservices
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - frontend
          - backend
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

  policyTypes:
    - Ingress

  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.2.0/24
        - ipBlock:
            cidr: 10.10.1.0/24
      ports:
        - protocol: TCP
          port: 80
