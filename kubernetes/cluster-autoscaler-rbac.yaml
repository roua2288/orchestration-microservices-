apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch

  - apiGroups: [""]
    resources:
      - endpoints
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch

  - apiGroups: [""]
    resources:
      - endpoints
    resourceNames:
      - cluster-autoscaler
    verbs:
      - get
      - update
      - patch

  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs:
      - create

  - apiGroups: [""]
    resources:
      - pods/status
    verbs:
      - update

  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - update
      - patch

  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - csinodes
      - csidrivers
      - csistoragecapacities
      - volumeattachments
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - resource.k8s.io
    resources:
      - deviceclasses
      - resourceclaims
      - resourceslices
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch

  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - cluster-autoscaler
    verbs:
      - get
      - update
      - patch

  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system