services:
  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: user_password
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U user_admin -d users_db
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: postgresql://user_admin:user_password@users-db:5432/users_db
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:80"
    depends_on:
      users-db:
        condition: service_healthy

  products-db:
    image: postgres:16-alpine
    container_name: products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: product_admin
      POSTGRES_PASSWORD: product_password
    ports:
      - "5434:5432"
    volumes:
      - products-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U product_admin -d products_db
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./services/product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: postgresql://product_admin:product_password@products-db:5432/products_db
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3002:80"
    depends_on:
      products-db:
        condition: service_healthy

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: order_password
    ports:
      - "5435:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U order_admin -d orders_db
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: postgresql://order_admin:order_password@orders-db:5432/orders_db
      PRODUCT_SERVICE_URL: http://product-service:80
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3003:80"
    depends_on:
      orders-db:
        condition: service_healthy

  payments-db:
    image: postgres:16-alpine
    container_name: payments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payment_admin
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5436:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U payment_admin -d payments_db
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: postgresql://payment_admin:payment_password@payments-db:5432/payments_db
      ORDER_SERVICE_URL: http://order-service:80
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3004:80"
    depends_on:
      payments-db:
        condition: service_healthy

  notifications-db:
    image: postgres:16-alpine
    container_name: notifications-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: notification_admin
      POSTGRES_PASSWORD: notification_password
    ports:
      - "5437:5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U notification_admin -d notifications_db
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: postgresql://notification_admin:notification_password@notifications-db:5432/notifications_db
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3005:80"
    depends_on:
      notifications-db:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend-app
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service

volumes:
  users-db-data:
  products-db-data:
  orders-db-data:
  payments-db-data:
  notifications-db-data: