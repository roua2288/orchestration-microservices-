name: CI - Build Test Scan Push

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-3
  AWS_ACCOUNT_ID: "136609826386"

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - backend
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

    steps:
      # 1. Recuperer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Node.js uniquement si le service contient package.json
      - name: Setup Node.js
        if: ${{ hashFiles(format('services/{0}/package.json', matrix.service)) != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Installer les dependances Node.js
      - name: Install dependencies
        if: ${{ hashFiles(format('services/{0}/package.json', matrix.service)) != '' }}
        working-directory: services/${{ matrix.service }}
        run: npm ci

      # 4. Executer les tests unitaires s'ils existent
      - name: Run unit tests
        if: ${{ hashFiles(format('services/{0}/package.json', matrix.service)) != '' }}
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "No unit tests configured for ${{ matrix.service }}"
          fi

      # 5. Construire l'image Docker
      - name: Build Docker image
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            BUILD_CONTEXT="./frontend-app"
          else
            BUILD_CONTEXT="./services/${{ matrix.service }}"
          fi

          echo "Build context: ${BUILD_CONTEXT}"

          docker build \
            --provenance=false \
            --sbom=false \
            -t ${{ matrix.service }}:${{ github.sha }} \
            "${BUILD_CONTEXT}"
      # 6. Scanner l'image avec Trivy
      # Les vulnerabilites sont affichees mais ne bloquent pas le pipeline
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      # 7. Authentification AWS uniquement lors d'un push
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 8. Connexion Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Tag et Push de l'image vers Amazon ECR
      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            ${{ matrix.service }}:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}

          docker push \
            ${ECR_REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}