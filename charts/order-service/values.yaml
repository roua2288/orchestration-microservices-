databaseSecretName: ""

replicaCount: 2

image:
  repository: "136609826386.dkr.ecr.eu-west-3.amazonaws.com/order-service"
  pullPolicy: IfNotPresent
  tag: "v3"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 80

configMap:
  enabled: true
  data:
    APP_NAME: "order-service"
    APP_ENV: "dev"
    AWS_REGION: "eu-west-3"
    LOG_LEVEL: "info"
    PAYMENT_SERVICE_URL: "http://orchestration-app-payment-service"
    CONNECT_TIMEOUT: "2"
    READ_TIMEOUT: "3"

secret:
  enabled: false
  managedExternally: false
  stringData: {}

probes:
  startup:
    enabled: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: "order-service.local"
      paths:
        - path: /
          pathType: Prefix
  tls: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
