# ============================================================
# Valeurs globales partagees
# ============================================================

global:
  # Environnement de deploiement
  environment: dev

  # Region AWS utilisee
  awsRegion: "eu-west-3"

  # Registre Amazon ECR commun aux images
  imageRegistry: "136609826386.dkr.ecr.eu-west-3.amazonaws.com"

  # Tag Docker par defaut
  imageTag: "f21422e91d302ad17eb1eba9cfdf8461c7d18475"
  # Politique de recuperation des images
  imagePullPolicy: IfNotPresent


# ============================================================
# Frontend
# ============================================================

frontend:
  # Active le microservice frontend
  enabled: true

  secret:
    enabled: true
    managedExternally: true

  # Nombre de replicas
  replicaCount: 1

  # Configuration de l'image Docker
  image:
    repository: "136609826386.dkr.ecr.eu-west-3.amazonaws.com/frontend"
    pullPolicy: IfNotPresent
    tag: "0811176ea6cd8cffd29e11e6cbdcfbe30050e327"
  # Service Kubernetes
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  # Configuration Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: frontend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Ressources CPU et memoire
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Autoscaling horizontal
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70


# Configuration applicative
configMap:
  # Active la creation du ConfigMap
  enabled: true

  # Variables d'environnement
  data:
    APP_NAME: "frontend"
    APP_ENV: "dev"
    AWS_REGION: "eu-west-3"
    LOG_LEVEL: "info"

# Configuration sensible
probes:
  # Verification que l'application reste fonctionnelle
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Verification que l'application peut recevoir du trafic
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Parametres de securite du conteneur
securityContext: {}


