# ============================================================
# Valeurs globales partagees
# ============================================================

global:
  # Environnement de deploiement
  environment: dev

  # Region AWS utilisee
  awsRegion: "eu-west-3"

  # Registre Amazon ECR commun aux images
  imageRegistry: "136609826386.dkr.ecr.eu-west-3.amazonaws.com"

  # Tag Docker par defaut
  imageTag: "2e16706efdd325880a8fee5da2ef262302d6f473"

  # Politique de recuperation des images
  imagePullPolicy: IfNotPresent


# ============================================================
# Frontend
# ============================================================

frontend:
  # Active le microservice frontend
  enabled: true

  # Nombre de replicas
  replicaCount: 2

  # Configuration de l'image Docker
  image:
    repository: "136609826386.dkr.ecr.eu-west-3.amazonaws.com/frontend"
    pullPolicy: IfNotPresent
    tag: "2e16706efdd325880a8fee5da2ef262302d6f473"

  # Service Kubernetes
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  # Configuration Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: frontend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Ressources CPU et memoire
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Autoscaling horizontal
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# Configuration applicative
configMap:
  # Active la creation du ConfigMap
  enabled: true

  # Variables d'environnement
  data:
    APP_NAME: "frontend"
    APP_ENV: "dev"
    AWS_REGION: "eu-west-3"
    LOG_LEVEL: "info"

# Configuration sensible
secret:
  # Active la creation du Secret
  enabled: true

  # Identifiants de demonstration
  stringData:
    DEMO_USERNAME: "microservice-user"
    DEMO_PASSWORD: "change-me"

# Probes Kubernetes
probes:
  # Verification que l'application reste fonctionnelle
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Verification que l'application peut recevoir du trafic
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Parametres de securite du conteneur
securityContext: {}


