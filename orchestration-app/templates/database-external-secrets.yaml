{{- if and .Values.databaseExternalSecrets .Values.databaseExternalSecrets.enabled }}
{{- range .Values.databaseExternalSecrets.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .targetSecretName }}-external-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $.Values.databaseExternalSecrets.refreshInterval | quote }}

  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName }}
    kind: ClusterSecretStore

  target:
    name: {{ .targetSecretName }}
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .remoteSecretName }}
        property: POSTGRES_DB

    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .remoteSecretName }}
        property: POSTGRES_USER

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .remoteSecretName }}
        property: POSTGRES_PASSWORD

    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .remoteSecretName }}
        property: DATABASE_URL
{{- end }}
{{- end }}