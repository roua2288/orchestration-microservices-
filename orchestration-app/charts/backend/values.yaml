# Nombre de réplicas du pod backend lorsque l'autoscaling est désactivé.
replicaCount: 2

# Configuration de l'image Docker du backend.
image:
  # URI du repository Amazon ECR contenant l'image du backend.
  repository: "136609826386.dkr.ecr.eu-west-3.amazonaws.com/backend"

  # Politique de téléchargement de l'image Kubernetes.
  # IfNotPresent évite de retélécharger l'image si elle existe déjà sur le nœud.
  pullPolicy: IfNotPresent

  # Tag/version de l'image Docker à déployer.
  tag: "v3"

# Secrets Kubernetes utilisés pour télécharger des images depuis un registre privé.
# Vide ici car EKS peut accéder à ECR via les permissions IAM des nœuds.
imagePullSecrets: []

# Permet de remplacer le nom par défaut généré par Helm.
# Une valeur vide conserve le nom défini par le chart.
nameOverride: ""

# Permet de remplacer complètement le nom généré par Helm.
# Une valeur vide conserve le nom calculé automatiquement.
fullnameOverride: ""

# Configuration du ServiceAccount Kubernetes utilisé par le backend.
serviceAccount:
  # Crée automatiquement un ServiceAccount dédié au backend.
  create: true

  # Monte automatiquement le token du ServiceAccount dans le pod.
  automount: true

  # Annotations supplémentaires du ServiceAccount, par exemple pour IRSA.
  annotations: {}

  # Nom personnalisé du ServiceAccount.
  # Une valeur vide permet à Helm de générer automatiquement le nom.
  name: ""

# Annotations Kubernetes supplémentaires appliquées aux pods.
podAnnotations: {}

# Labels Kubernetes supplémentaires appliqués aux pods.
podLabels: {}

# Contexte de sécurité appliqué au niveau du pod.
podSecurityContext:
  # false permet actuellement au conteneur de fonctionner avec un utilisateur root.
  # Peut être mis à true si l'image supporte l'exécution non-root.
  runAsNonRoot: false

# Contexte de sécurité appliqué directement au conteneur.
# Vide ici : aucune règle supplémentaire n'est définie.
securityContext: {}

# Configuration du Service Kubernetes exposant le backend dans le cluster.
service:
  # ClusterIP rend le service accessible uniquement à l'intérieur du cluster.
  type: ClusterIP

  # Port exposé par le Service Kubernetes.
  port: 80

  # Port du conteneur vers lequel le trafic est redirigé.
  targetPort: 80

# Configuration non sensible injectée dans le backend via ConfigMap.
configMap:
  # Active la création du ConfigMap.
  enabled: true

  # Variables d'environnement de l'application.
  data:
    # Nom logique de l'application.
    APP_NAME: "backend"

    # Environnement d'exécution de l'application.
    APP_ENV: "dev"

    # Région AWS utilisée par l'application.
    AWS_REGION: "eu-west-3"

    # Niveau de détail des logs applicatifs.
    LOG_LEVEL: "info"

# Configuration sensible injectée dans le backend via Kubernetes Secret.
secret:
  # Active la création du Secret.
  enabled: true

  # Valeurs stockées dans le Secret sous forme de chaînes.
  # En production, ces valeurs doivent être remplacées par une solution sécurisée.
  stringData:
    # Nom d'utilisateur utilisé pour la démonstration.
    DEMO_USERNAME: "microservice-user"

    # Mot de passe de démonstration.
    # Cette valeur doit être remplacée dans un environnement réel.
    DEMO_PASSWORD: "change-me"

# Configuration des probes Kubernetes utilisées pour vérifier l'état du backend.
probes:

  # Startup Probe : vérifie que l'application a correctement démarré.
  startup:
    # Active la startup probe.
    enabled: true

    # Endpoint HTTP utilisé pour vérifier le démarrage.
    path: /

    # Temps d'attente avant le premier contrôle, en secondes.
    initialDelaySeconds: 0

    # Intervalle entre deux contrôles, en secondes.
    periodSeconds: 5

    # Durée maximale d'attente d'une réponse, en secondes.
    timeoutSeconds: 3

    # Nombre maximal d'échecs avant de considérer le démarrage comme échoué.
    failureThreshold: 30

  # Liveness Probe : vérifie que l'application reste fonctionnelle.
  liveness:
    # Active la liveness probe.
    enabled: true

    # Endpoint HTTP utilisé pour vérifier que le conteneur est vivant.
    path: /

    # Délai avant le premier contrôle.
    initialDelaySeconds: 10

    # Intervalle entre les contrôles.
    periodSeconds: 10

    # Timeout d'une requête de vérification.
    timeoutSeconds: 3

    # Nombre d'échecs avant que Kubernetes redémarre le conteneur.
    failureThreshold: 3

  # Readiness Probe : détermine si le pod peut recevoir du trafic.
  readiness:
    # Active la readiness probe.
    enabled: true

    # Endpoint HTTP utilisé pour vérifier la disponibilité.
    path: /

    # Délai avant le premier contrôle.
    initialDelaySeconds: 5

    # Intervalle entre les contrôles.
    periodSeconds: 5

    # Timeout d'une requête de vérification.
    timeoutSeconds: 3

    # Nombre d'échecs avant que le pod soit considéré comme non prêt.
    failureThreshold: 3

# Ressources CPU et mémoire attribuées au backend.
resources:
  # Ressources minimales réservées par Kubernetes.
  requests:
    # CPU minimum demandé : 100 milliCPU.
    cpu: 100m

    # Mémoire minimale réservée.
    memory: 128Mi

  # Limites maximales autorisées pour le conteneur.
  limits:
    # CPU maximum autorisé : 500 milliCPU.
    cpu: 500m

    # Mémoire maximale autorisée.
    memory: 256Mi

# Configuration du Horizontal Pod Autoscaler (HPA).
autoscaling:
  # Active l'autoscaling automatique du backend.
  enabled: true

  # Nombre minimum de réplicas.
  minReplicas: 2

  # Nombre maximum de réplicas.
  maxReplicas: 5

  # Pourcentage moyen d'utilisation CPU déclenchant l'adaptation du nombre de pods.
  targetCPUUtilizationPercentage: 70

# Configuration d'un Ingress dédié au backend.
ingress:
  # L'Ingress est désactivé car l'exposition est gérée ailleurs dans le projet.
  enabled: false

  # Classe Ingress à utiliser, par exemple alb ou nginx.
  className: ""

  # Annotations supplémentaires de l'Ingress.
  annotations: {}

  # Liste des hosts et chemins exposés par l'Ingress.
  hosts:
    # Nom DNS utilisé si l'Ingress est activé.
    - host: "backend.local"

      # Routes HTTP associées à ce host.
      paths:
        # Chemin exposé.
        - path: /

          # Prefix signifie que tous les chemins commençant par "/" correspondent.
          pathType: Prefix

  # Configuration TLS de l'Ingress.
  # Vide ici : aucun certificat TLS n'est configuré.
  tls: []

# Volumes Kubernetes supplémentaires à monter dans le pod.
# Aucun volume supplémentaire n'est actuellement utilisé.
volumes: []

# Points de montage correspondant aux volumes définis ci-dessus.
volumeMounts: []

# Contraintes de sélection des nœuds Kubernetes.
# Vide ici : le backend peut être planifié sur tout nœud compatible.
nodeSelector: {}

# Tolérations permettant au pod d'être planifié sur des nœuds avec des taints.
tolerations: []

# Règles d'affinité/anti-affinité utilisées pour contrôler le placement des pods.
affinity: {}
# Stratégie de mise à jour progressive
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
