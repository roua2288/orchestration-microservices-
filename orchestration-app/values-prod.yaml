# ============================================================
# Configuration globale - environnement PRODUCTION
# ============================================================

global:
  # Environnement de déploiement
  environment: prod

  # Région AWS utilisée
  awsRegion: eu-west-3

  # Tag Docker global
  imageTag: v3

  # Toujours récupérer la dernière image
  imagePullPolicy: Always


# ============================================================
# Frontend
# ============================================================

frontend:
  # Nombre initial de pods
  replicaCount: 3

  # Service Kubernetes
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80

  # Ressources CPU et mémoire
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60

  # Variables de configuration
  configMap:
    data:
      APP_ENV: prod
      LOG_LEVEL: warn


